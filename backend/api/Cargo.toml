[package]
name = "api"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "mailquill"
path = "src/main.rs"

[dependencies]
mailquill-core = { workspace = true }
db = { workspace = true }
mail-sync = { path = "../mail-sync" }
phishing = { workspace = true }
smtp = { path = "../smtp" }
contact-sync = { path = "../contact-sync" }
calendar-sync = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
rust-embed = { version = "8", features = ["axum-ex"] }
serde = { workspace = true }
serde_json = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
mime_guess = "2"
sqlx = { workspace = true, features = ["macros", "migrate", "chrono", "uuid"] }
argon2 = "0.5"
chrono = { workspace = true }
oauth2 = "5"
rand = { workspace = true }
hex = { workspace = true }
strsim = "0.11"
thiserror = { workspace = true }
async-trait = { workspace = true }
urlencoding = { workspace = true }
figment = { version = "0.10", features = ["toml", "yaml", "env"] }
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
p256 = "0.14"
clap = { version = "4", features = ["derive"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = { workspace = true }
tokio-native-tls = { workspace = true }
native-tls = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
hickory-resolver = "0.26"
reqwest = { workspace = true, features = ["json", "form"] }
quick-xml = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.11"
# Only used to forward the `vendored` feature to the transitive OpenSSL
# dependency (web-push → ece) for targets without system OpenSSL.
openssl = { version = "0.10", optional = true }

[features]
# Compile OpenSSL from source instead of linking the system library.
# Used by the release workflow for the macOS and Windows binaries.
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[package.metadata.cargo-machete]
ignored = ["openssl"]
