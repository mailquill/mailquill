[package]
name = "contact-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
mailquill-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.37"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
