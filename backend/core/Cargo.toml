[package]
name = "mailquill-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "any", "macros", "uuid", "chrono"] }
serde = { workspace = true }
object_store = { version = "0.14", features = ["aws"] }
aes-gcm = "0.11"
zstd = "0.13"
sha2 = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
# v11 no longer picks a crypto backend on its own; without exactly one of
# `rust_crypto`/`aws_lc_rs` the first encode() panics at runtime.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
mailparse = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
