services:
  app:
    image: ghcr.io/mailquill/mailquill:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Container runs as UID 1000: create the directory with
      # `mkdir data && sudo chown 1000:1000 data` before first start.
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
