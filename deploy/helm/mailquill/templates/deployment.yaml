{{- if eq .Values.database.type "postgres" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailquill.fullname" . }}
  labels: {{ include "mailquill.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "mailquill.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "mailquill.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: mailquill
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "mailquill.fullname" . }}{{ end }}
          {{- range $k, $v := .Values.env }}
          env:
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
{{- end }}
