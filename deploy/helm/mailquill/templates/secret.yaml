{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailquill.fullname" . }}
  labels: {{ include "mailquill.labels" . | nindent 4 }}
type: Opaque
data: {}
# Populate via --set or a values override file. Required keys:
#   JWT_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, CREDENTIAL_ENCRYPTION_KEY
# Use existingSecret to point to a pre-existing Secret instead.
{{- end }}
