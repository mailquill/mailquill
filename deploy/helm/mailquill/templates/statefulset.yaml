{{- if eq .Values.database.type "sqlite" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailquill.fullname" . }}
  labels: {{ include "mailquill.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "mailquill.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "mailquill.fullname" . }}
  template:
    metadata:
      labels: {{ include "mailquill.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: mailquill
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "mailquill.fullname" . }}{{ end }}
          env:
            - name: DATA_DIR
              value: /data
          {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode | quote }}]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
