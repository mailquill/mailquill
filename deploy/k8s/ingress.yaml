apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailquill
  namespace: mailquill
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - mail.example.com
      secretName: mailquill-tls
  rules:
    - host: mail.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailquill
                port:
                  number: 8080
