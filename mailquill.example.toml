# Mailquill configuration file.
# Copy to mailquill.toml (project root) and fill in required values.
#
# Priority (highest wins): environment variables > this file > built-in defaults.
# For env var names, use the same key in uppercase, e.g. CREDENTIAL_ENCRYPTION_KEY.
# For nested keys (none currently), use __ as separator: SECTION__KEY.

# ── Required ─────────────────────────────────────────────────────────────────

# AES-256-GCM key. Generate: openssl rand -hex 32
credential_encryption_key = "replace_me_64_hex_chars"

# JWT signing secret. Generate: openssl rand -base64 48
jwt_secret = "replace_me_long_random_string"

# ── Optional — defaults shown ────────────────────────────────────────────────

data_dir    = "./data"
server_host = "0.0.0.0"
server_port = 8080
app_base_url = "http://localhost:8080"

# ── Phishing detection ───────────────────────────────────────────────────────

# Brand list for spoofing/lookalike checks. The shipped default lives next to
# the binary (brands.json, set MAILQUILL_BRANDS_FILE to override its path) and
# is copied to <data_dir>/brands.json on first start; edit that copy to
# customise — it takes precedence over the shipped file.

# OpenPhish community feed for link-reputation checks. Download only (no user
# data leaves the server); refreshed every 12 hours, cached in <data_dir>.
# openphish_enabled  = true
# openphish_feed_url = "https://openphish.com/feed.txt"

# ── Web Push (desktop notifications) ─────────────────────────────────────────

# VAPID keys enable desktop notifications. Generate a pair with:
#   npx web-push generate-vapid-keys --json
# Without them, the notifications toggle is disabled.
# vapid_public_key  = ""
# vapid_private_key = ""
# vapid_subject     = "mailto:admin@example.com"

# ── OAuth2 (only needed for Gmail / Outlook OAuth login) ─────────────────────

# google_oauth_client_id     = ""
# google_oauth_client_secret = ""
# microsoft_oauth_client_id     = ""
# microsoft_oauth_client_secret = ""
